services:
  codex-monitor:
    build: .
    container_name: codex-monitor
    restart: unless-stopped
    ports:
      - "8080:8080"
    # Mount local/ so data.json and history.json persist on your host
    volumes:
      - ./local:/app:rw
    environment:
      - LOOP_INTERVAL=${LOOP_INTERVAL:-900}
    # All secrets come from local/.env (never commit that file)
    env_file:
      - local/.env
