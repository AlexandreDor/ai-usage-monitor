<svg width="100%" viewBox="0 0 680 580">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text class="ts" x="340" y="16" text-anchor="middle">runs every 15 min via cron / tmux loop</text>
<path d="M230 12 Q180 12 180 30 L180 48 Q180 52 184 52" fill="none" stroke="var(--s)" stroke-width="0.5" stroke-dasharray="3 3" marker-end="url(#arrow)"/>

<g class="node c-gray" onclick="sendPrompt('Explain how codex /status works and what output it produces')">
<rect x="220" y="30" width="240" height="48" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="48" text-anchor="middle" dominant-baseline="central">codex /status</text>
<text class="ts" x="340" y="64" text-anchor="middle" dominant-baseline="central">ASCII usage output</text>
</g>

<line x1="340" y1="78" x2="340" y2="108" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="350" y="96" text-anchor="start">stdout</text>

<g class="c-teal">
<rect x="55" y="108" width="570" height="185" rx="16" stroke-width="0.5" stroke-dasharray="6 3"/>
<text class="th" x="340" y="130" text-anchor="middle" dominant-baseline="central">monitor.sh</text>
</g>

<g class="node c-purple" onclick="sendPrompt('Show me how the ANSI stripping and scraping works in monitor.sh')">
<rect x="75" y="148" width="150" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="150" y="168" text-anchor="middle" dominant-baseline="central">Scrape</text>
<text class="ts" x="150" y="186" text-anchor="middle" dominant-baseline="central">Strip ANSI codes</text>
</g>

<line x1="225" y1="176" x2="260" y2="176" class="arr" marker-end="url(#arrow)"/>

<g class="node c-purple" onclick="sendPrompt('Show me how the regex parsing extracts percentage values from codex output')">
<rect x="260" y="148" width="160" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="168" text-anchor="middle" dominant-baseline="central">Parse</text>
<text class="ts" x="340" y="186" text-anchor="middle" dominant-baseline="central">Regex → JSON blob</text>
</g>

<line x1="420" y1="176" x2="455" y2="176" class="arr" marker-end="url(#arrow)"/>

<g class="node c-purple" onclick="sendPrompt('Explain how the threshold checking and alert state tracking works')">
<rect x="455" y="148" width="150" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="530" y="168" text-anchor="middle" dominant-baseline="central">Threshold check</text>
<text class="ts" x="530" y="186" text-anchor="middle" dominant-baseline="central">Compare to limits</text>
</g>

<g class="node c-gray" onclick="sendPrompt('How does the alert state file prevent duplicate notifications?')">
<rect x="468" y="224" width="124" height="36" rx="6" stroke-width="0.5"/>
<text class="ts" x="530" y="242" text-anchor="middle" dominant-baseline="central">.alert_state file</text>
</g>
<line class="leader" x1="530" y1="204" x2="530" y2="222"/>

<text class="ts" x="122" y="313" text-anchor="middle">if threshold crossed</text>
<path d="M150 293 L150 335 L120 335 L120 370" fill="none" class="arr" marker-end="url(#arrow)"/>

<text class="ts" x="340" y="313" text-anchor="middle">always (every cycle)</text>
<line x1="340" y1="293" x2="340" y2="370" class="arr" marker-end="url(#arrow)"/>

<text class="ts" x="558" y="313" text-anchor="middle">if threshold crossed</text>
<path d="M530 293 L530 335 L560 335 L560 370" fill="none" class="arr" marker-end="url(#arrow)"/>

<g class="node c-coral" onclick="sendPrompt('How do I set up a Discord webhook for the Codex monitor alerts?')">
<rect x="40" y="370" width="160" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="120" y="390" text-anchor="middle" dominant-baseline="central">Discord</text>
<text class="ts" x="120" y="408" text-anchor="middle" dominant-baseline="central">Webhook alert</text>
</g>

<g class="node c-gray" onclick="sendPrompt('Explain how GitHub Gist works as a free JSON storage backend')">
<rect x="260" y="370" width="160" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="390" text-anchor="middle" dominant-baseline="central">GitHub Gist</text>
<text class="ts" x="340" y="408" text-anchor="middle" dominant-baseline="central">JSON storage</text>
</g>

<g class="node c-blue" onclick="sendPrompt('How do I set up a Telegram bot for the Codex monitor alerts?')">
<rect x="480" y="370" width="160" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="560" y="390" text-anchor="middle" dominant-baseline="central">Telegram</text>
<text class="ts" x="560" y="408" text-anchor="middle" dominant-baseline="central">Bot API alert</text>
</g>

<line x1="340" y1="426" x2="340" y2="470" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="350" y="452" text-anchor="start">fetch raw JSON</text>

<g class="node c-teal" onclick="sendPrompt('How does the GitHub Pages dashboard read data from the Gist and display it?')">
<rect x="240" y="470" width="200" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="490" text-anchor="middle" dominant-baseline="central">GitHub Pages</text>
<text class="ts" x="340" y="508" text-anchor="middle" dominant-baseline="central">Live dashboard</text>
</g>

<text class="ts" x="340" y="550" text-anchor="middle">browser auto refreshes every 60s</text>
</svg>