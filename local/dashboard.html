<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Codex Usage Monitor</title>
  <meta name="description" content="Live dashboard for OpenAI Codex CLI usage limits" />
  <link rel="icon" type="image/png" sizes="128x128" href="images/favicon.png" />
  <link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&f[]=satoshi@400,500,700&display=swap"
    rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #030817;
      --surface: rgba(8, 20, 43, 0.82);
      --surface2: #0b1930;
      --border: rgba(96, 165, 250, 0.2);
      --text: #edf5ff;
      --muted: #86a2c5;
      --accent: #38bdf8;
      --usage-green: #22c55e;
      --yellow: #f1c75b;
      --orange: #f08c46;
      --red: #f35b6b;
      --red-dark: #8f2638;
      --radius: 16px;
      --blue-glow: rgba(56, 189, 248, 0.28);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Satoshi", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      padding: 24px 16px 48px;
      position: relative;
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    body::before {
      background:
        radial-gradient(ellipse 80% 50% at 15% 10%, rgba(37, 99, 235, 0.2), transparent 52%),
        radial-gradient(ellipse 60% 60% at 85% 25%, rgba(14, 165, 233, 0.12), transparent 52%),
        radial-gradient(ellipse 90% 70% at 50% 95%, rgba(30, 64, 175, 0.14), transparent 54%);
      z-index: -2;
    }

    body::after {
      background-image:
        radial-gradient(2px 2px at 20px 30px, rgba(255, 255, 255, .8), transparent),
        radial-gradient(2px 2px at 40px 70px, rgba(255, 255, 255, .5), transparent),
        radial-gradient(1px 1px at 90px 40px, rgba(255, 255, 255, .6), transparent),
        radial-gradient(2px 2px at 130px 80px, rgba(255, 255, 255, .4), transparent),
        radial-gradient(1px 1px at 160px 120px, rgba(255, 255, 255, .7), transparent),
        radial-gradient(2px 2px at 200px 60px, rgba(56, 189, 248, .55), transparent);
      background-size: 350px 200px;
      opacity: 0.45;
      animation: twinkle 8s ease-in-out infinite alternate;
      z-index: -1;
    }

    header {
      max-width: 960px;
      margin: 0 auto 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      text-align: center;
    }

    header h1 {
      font-family: "Clash Display", system-ui, sans-serif;
      font-size: clamp(2.5rem, 7vw, 4.25rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 0.95;
      background: linear-gradient(135deg, #f4f8ff 0%, #60a5fa 48%, #2563eb 100%);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: gradientShift 6s ease infinite;
    }

    .badge {
      font-size: 0.7rem;
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 2px 8px;
      border-radius: 20px;
      color: var(--muted);
    }

    #mode-badge {
      display: none;
    }

    #last-updated {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .grid {
      max-width: 960px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    @media (max-width: 720px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      backdrop-filter: blur(12px);
      box-shadow: 0 18px 48px rgba(2, 8, 23, 0.48), inset 0 1px 0 rgba(147, 197, 253, 0.05);
    }

    .card.full {
      grid-column: 1 / -1;
    }

    .limit-card {
      text-align: center;
      padding: 34px 28px 30px;
    }

    .card-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 10px;
      font-family: "Clash Display", system-ui, sans-serif;
    }

    .pct-value {
      font-size: 4.5rem;
      font-weight: 800;
      line-height: 0.95;
      margin-bottom: 18px;
    }

    .bar-track {
      height: 10px;
      background: var(--surface2);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .bar-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.6s ease, background-color 0.4s;
    }

    .reset-info {
      font-size: 0.95rem;
      color: var(--muted);
    }

    .reset-info span {
      color: var(--text);
    }

    .pace-indicator {
      margin-top: 18px;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(3, 8, 23, 0.45);
    }

    .pace-label {
      margin-bottom: 3px;
      color: var(--muted);
      font-size: 0.66rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .pace-value {
      color: var(--muted);
      font-size: 0.88rem;
      font-weight: 700;
    }

    .pace-value.ahead {
      color: var(--usage-green);
    }

    .pace-value.behind {
      color: var(--orange);
    }

    .meta-row {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      justify-content: center;
      text-align: center;
    }

    .meta-row> :first-child {
      display: none;
    }

    .meta-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 2px;
    }

    .meta-value {
      font-size: 0.95rem;
      font-weight: 500;
    }

    #error-banner {
      max-width: 960px;
      margin: 0 auto 20px;
      background: #3d1c1c;
      border: 1px solid #7d2020;
      border-radius: var(--radius);
      padding: 16px 20px;
      font-size: 0.9rem;
      display: none;
    }

    .summary-card {
      display: none;
      padding: 18px 24px;
    }

    .footer-note {
      max-width: 960px;
      margin: 20px auto 0;
      text-align: center;
      color: var(--muted);
      font-size: 0.82rem;
      letter-spacing: 0.04em;
    }

    .footer-tagline {
      font-style: italic;
    }

    canvas {
      max-height: 220px;
    }

    .live-dot {
      display: none;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: .3
      }
    }

    @keyframes twinkle {
      0% {
        opacity: 0.35;
      }

      100% {
        opacity: 0.65;
      }
    }

    @keyframes gradientShift {

      0%,
      100% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }
    }

  </style>
</head>

<body>
  <header>
    <span class="live-dot"></span>
    <h1>Codex Limits</h1>
    <span class="badge" id="mode-badge">—</span>
    <span id="last-updated">—</span>
  </header>

  <div id="error-banner"></div>

  <div class="grid">
    <div class="card limit-card">
      <div class="card-label">5-Hour Limit</div>
      <div class="pct-value" id="five-h-pct">—</div>
      <div class="bar-track">
        <div class="bar-fill" id="five-h-bar" style="width:0%"></div>
      </div>
      <div class="reset-info">Resets at <span id="five-h-reset">—</span></div>
    </div>
    <div class="card limit-card">
      <div class="card-label">Weekly Limit</div>
      <div class="pct-value" id="weekly-pct">—</div>
      <div class="bar-track">
        <div class="bar-fill" id="weekly-bar" style="width:0%"></div>
      </div>
      <div class="reset-info">Resets <span id="weekly-reset">—</span></div>
      <div class="pace-indicator">
        <div class="pace-label">Pace vs ideal</div>
        <div class="pace-value" id="weekly-pace-delta">--</div>
      </div>
    </div>
    <div class="card full">
      <div class="card-label" id="history-label" style="margin-bottom:16px">8-Day Rolling History</div>
      <canvas id="history-chart"></canvas>
    </div>
  </div>

  <div class="footer-note">Made with ❤️☕ & Codex 👾</div>
  <div class="footer-note footer-tagline">Just one more prompt&trade;</div>

  <script>
    // -------------------------------------------------------------------------
    // DATA SOURCE CONFIGURATION
    //
    // Mode 1 — Local (default): fetches data.json served by serve.sh / Docker
    // Mode 2 — GitHub Pages: fetches from a GitHub Gist (set GIST_ID below)
    //
    // To use GitHub Pages mode, replace the empty string with your Gist ID:
    //   const GIST_ID = 'abc123def456your_gist_id_here';
    // Leave as '' to auto-use local mode.
    // -------------------------------------------------------------------------
    const GIST_ID = '';
    const REFRESH_INTERVAL_MS = 900_000;

    let chart = null;
    let refreshTimer = null;

    function pctColor(p) {
      return 'var(--usage-green)';
    }
    function validPct(value) {
      if (value === null || value === undefined || value === '') return null;
      const pct = Number(value);
      return Number.isFinite(pct) && pct >= 0 && pct <= 100 ? pct : null;
    }
    function displayText(value, fallback = '—', maxLength = 200) {
      return typeof value === 'string' && value.length <= maxLength ? value : fallback;
    }
    function scheduleRefresh(data = null) {
      const intervalSeconds = Number(data?.sample_interval_seconds);
      const intervalMs = Number.isFinite(intervalSeconds) && intervalSeconds > 0
        ? intervalSeconds * 1000
        : REFRESH_INTERVAL_MS;
      const now = Date.now();
      const nextUpdate = (Math.floor((now - 5_000) / intervalMs) + 1) * intervalMs + 5_000;
      const delay = nextUpdate - now;
      clearTimeout(refreshTimer);
      refreshTimer = setTimeout(refresh, delay);
    }
    function fmtTime(iso) {
      try { return new Date(iso).toLocaleString(); } catch { return iso || '—'; }
    }
    function historyLabel(hours) {
      const value = Number(hours);
      if (!Number.isFinite(value) || value <= 0) return 'History';
      if (value >= 24 && value % 24 === 0) {
        const days = value / 24;
        return `${days}-Day Rolling History`;
      }
      const label = Number.isInteger(value) ? value.toString() : value.toFixed(1);
      return `${label}-Hour Rolling History`;
    }
    function idealWeeklyRemaining(sampledAt, resetTimestamp) {
      const sampledAtMs = Date.parse(displayText(sampledAt, ''));
      const resetAtMs = Number(resetTimestamp) * 1000;
      const weeklyWindowMs = 7 * 24 * 60 * 60 * 1000;
      const cycleStartMs = resetAtMs - weeklyWindowMs;
      if (!Number.isFinite(sampledAtMs) || !Number.isFinite(resetAtMs)) return null;
      if (sampledAtMs < cycleStartMs || sampledAtMs > resetAtMs) return null;
      return Math.round((100 * (resetAtMs - sampledAtMs) / weeklyWindowMs) * 10) / 10;
    }
    function renderWeeklyPaceDelta(data) {
      const element = document.getElementById('weekly-pace-delta');
      const actual = validPct(data.weekly_pct);
      const ideal = idealWeeklyRemaining(data.scraped_at, data.weekly_reset_at);
      element.classList.remove('ahead', 'behind');

      if (actual === null || ideal === null) {
        element.textContent = '--';
        element.title = 'Weekly pace unavailable';
        return;
      }

      const rawDifference = actual - ideal;
      const pointDifference = Math.round(rawDifference * 10) / 10;
      const relativeDifference = ideal > 0
        ? Math.round((Math.abs(rawDifference) / ideal) * 1000) / 10
        : null;
      const direction = pointDifference === 0 ? 'on pace' : pointDifference > 0 ? 'above' : 'below';
      const sign = pointDifference > 0 ? '+' : '';
      const relativeLabel = relativeDifference === null ? '' : ` · ${relativeDifference.toFixed(1)}% ${direction}`;

      element.textContent = `${sign}${pointDifference.toFixed(1)} pts${relativeLabel}`;
      element.title = `Actual remaining: ${actual.toFixed(1)}% · Ideal remaining: ${ideal.toFixed(1)}%`;
      element.classList.add(pointDifference >= 0 ? 'ahead' : 'behind');
    }
    function setBar(barId, pctId, pct) {
      const safePct = validPct(pct);
      const c = safePct === null ? 'var(--muted)' : pctColor(safePct);
      const bar = document.getElementById(barId);
      bar.style.width = `${safePct ?? 0}%`;
      bar.style.backgroundColor = c;
      const el = document.getElementById(pctId);
      el.textContent = safePct === null ? '--' : safePct + '%';
      el.style.color = c;
    }
    function clearMetrics() {
      setBar('five-h-bar', 'five-h-pct', 0);
      setBar('weekly-bar', 'weekly-pct', 0);
      document.getElementById('five-h-pct').textContent = '--';
      document.getElementById('weekly-pct').textContent = '--';
      document.getElementById('five-h-pct').style.color = 'var(--muted)';
      document.getElementById('weekly-pct').style.color = 'var(--muted)';
      document.getElementById('five-h-reset').textContent = '--';
      document.getElementById('weekly-reset').textContent = '--';
      const paceDelta = document.getElementById('weekly-pace-delta');
      paceDelta.textContent = '--';
      paceDelta.classList.remove('ahead', 'behind');
      document.getElementById('history-label').textContent = 'History unavailable';
      if (chart) {
        chart.destroy();
        chart = null;
      }
    }
    function showError(msg) {
      const el = document.getElementById('error-banner');
      el.textContent = 'Warning: ' + displayText(msg, 'Unable to load dashboard data');
      el.style.display = 'block';
    }
    function hideError() {
      document.getElementById('error-banner').style.display = 'none';
    }

    function renderHistory(history, data) {
      if (!Array.isArray(history) || !history.length) return;
      const rev = history.slice(0, 2000).reverse();
      const labels = rev.map(d => {
        try { return new Date(displayText(d?.scraped_at, '')).toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }); }
        catch { return ''; }
      });
      const ctx = document.getElementById('history-chart').getContext('2d');
      if (chart) chart.destroy();
      chart = new Chart(ctx, {
        type: 'line',
        data: {
          labels,
          datasets: [
            { label: '5h Limit %', data: rev.map(d => validPct(d?.five_h_pct)), borderColor: '#22c55e', backgroundColor: 'rgba(34,197,94,0.1)', borderWidth: 2, pointRadius: 2, tension: 0.3, fill: true },
            { label: 'Weekly Limit %', data: rev.map(d => validPct(d?.weekly_pct)), borderColor: '#4ade80', backgroundColor: 'rgba(74,222,128,0.08)', borderWidth: 2, pointRadius: 2, tension: 0.3, fill: true },
            { label: 'Ideal weekly pace', data: rev.map(d => idealWeeklyRemaining(d?.scraped_at, data.weekly_reset_at)), borderColor: '#a7f3d0', backgroundColor: 'transparent', borderWidth: 2, borderDash: [8, 6], pointRadius: 0, tension: 0, fill: false, spanGaps: false },
          ],
        },
        options: {
          responsive: true, maintainAspectRatio: true,
          scales: {
            y: { min: 0, max: 100, grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#8b949e', callback: v => v + '%' } },
            x: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#8b949e', maxTicksLimit: 12 } },
          },
          plugins: { legend: { labels: { color: '#e6edf3', boxWidth: 12 } } },
        },
      });
    }

    function renderData(data, history) {
      if (!data || typeof data !== 'object' || Array.isArray(data)) {
        throw new Error('Invalid dashboard data');
      }
      hideError();
      setBar('five-h-bar', 'five-h-pct', data.five_h_pct);
      setBar('weekly-bar', 'weekly-pct', data.weekly_pct);
      document.getElementById('five-h-reset').textContent = displayText(data.five_h_reset);
      document.getElementById('weekly-reset').textContent = displayText(data.weekly_reset);
      renderWeeklyPaceDelta(data);
      document.getElementById('last-updated').textContent = 'Last scraped ' + fmtTime(displayText(data.scraped_at, ''));
      document.getElementById('history-label').textContent = historyLabel(data.history_window_hours);
      if (history) renderHistory(history, data);
      scheduleRefresh(data);
    }

    // ---- Mode 1: Local (serve.sh / Docker) ----------------------------------
    async function fetchLocal() {
      document.getElementById('mode-badge').textContent = 'LOCAL';
      const dataRes = await fetch('data.json?_=' + Date.now());
      if (!dataRes.ok) throw new Error('data.json not found — run ./monitor.sh first, then ./serve.sh');
      const data = await dataRes.json();

      let history = null;
      try {
        const hRes = await fetch('history.json?_=' + Date.now());
        if (hRes.ok) history = await hRes.json();
      } catch { /* optional */ }

      renderData(data, history);
    }

    // ---- Mode 2: GitHub Pages via Gist API ----------------------------------
    async function fetchGist() {
      document.getElementById('mode-badge').textContent = 'EXTERNAL';
      const res = await fetch(`https://api.github.com/gists/${GIST_ID}?_=` + Date.now());
      if (!res.ok) throw new Error(`GitHub API returned HTTP ${res.status} — check GIST_ID`);
      const gist = await res.json();

      const dataContent = gist.files['data.json']?.content;
      if (!dataContent) throw new Error('data.json not found in Gist — run monitor.sh with GITHUB_PAT and GITHUB_GIST_ID set');
      const data = JSON.parse(dataContent);

      let history = null;
      try {
        const hContent = gist.files['history.json']?.content;
        if (hContent) history = JSON.parse(hContent);
      } catch { /* optional */ }

      renderData(data, history);
    }

    // ---- Auto-detect mode and refresh ---------------------------------------
    async function refresh() {
      try {
        if (GIST_ID) {
          await fetchGist();
        } else {
          await fetchLocal();
        }
      } catch (err) {
        showError(err.message);
        clearMetrics();
        document.getElementById('mode-badge').textContent = 'STALE';
        document.getElementById('last-updated').textContent = 'Failed ' + new Date().toLocaleTimeString();
        scheduleRefresh();
      }
    }

    refresh();
  </script>
</body>

</html>
