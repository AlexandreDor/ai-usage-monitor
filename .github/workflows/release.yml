name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.validate_version.outputs.version }}
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install quality dependencies
        run: python -m pip install --requirement requirements-ci.txt

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck

      - name: Install browser test dependencies
        run: npm ci

      - name: Validate tag and source version
        id: validate_version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin dev
          git merge-base --is-ancestor "$GITHUB_SHA" origin/dev
          version="$(tr -d '[:space:]' < VERSION)"
          test "$RELEASE_TAG" = "v$version"
          printf '%s\n' "$version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*)|([0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))(\.((0|[1-9][0-9]*)|([0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)))*)?$'
          changelog_heading="$(awk -v expected="## [$version]" '
            index($0, expected) != 1 { next }
            {
              suffix = substr($0, length(expected) + 1)
              if (suffix == "" || suffix ~ /^ - [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]$/) {
                print $0
                exit
              }
            }
          ' CHANGELOG.md)"
          test -n "$changelog_heading"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Validate source, units, and functional tests
        run: |
          set -euo pipefail
          expected_python="$(tr -d '[:space:]' < .python-version)"
          actual_python="$(python -c 'import platform; print(platform.python_version())')"
          test "$actual_python" = "$expected_python"
          expected_node="$(tr -d '[:space:]' < .node-version)"
          test "$(node --version)" = "v$expected_node"
          bash -n local/*.sh scripts/*.sh tests/*.sh tests/lib/*.sh tests/fixtures/*.sh
          python -m unittest tests.test_migrations
          python -m unittest tests.test_codex_client
          python -m compileall -q local tests
          systemd-analyze verify packaging/systemd/codex-usage-monitor.service packaging/systemd/codex-usage-dashboard.service
          python -m coverage run --branch --rcfile=.coveragerc -m unittest \
            tests.test_migrations tests.test_alerts tests.test_anomalies \
            tests.test_history tests.test_codex_client tests.test_config \
            tests.test_storage_durability
          python -m coverage report --rcfile=.coveragerc
          SKIP_PYTHON_TESTS=1 tests/run.sh
          npx playwright install --with-deps chromium
          npm run test:browser
          npm audit --audit-level=low
          shellcheck -x local/*.sh scripts/*.sh tests/*.sh tests/lib/*.sh tests/fixtures/*.sh

      - name: Build and verify release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          scripts/build-release.sh --tag "$RELEASE_TAG" --output-dir dist
          version="$(tr -d '[:space:]' < VERSION)"
          (cd dist && sha256sum --check "codex-usage-monitor-${version}.tar.gz.sha256")
          ! tar -tzf "dist/codex-usage-monitor-${version}.tar.gz" | grep -E '(^|/)(\.env$|runtime/|.*\.(sqlite3|db|sqlite)$|.*-(wal|shm|journal)$)'

      - name: Upload release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: |
            dist/codex-usage-monitor-${{ steps.validate_version.outputs.version }}.tar.gz
            dist/codex-usage-monitor-${{ steps.validate_version.outputs.version }}.tar.gz.sha256
          if-no-files-found: error

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          test "$RELEASE_TAG" = "v$RELEASE_VERSION"
          prerelease=()
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" \
            "dist/codex-usage-monitor-${RELEASE_VERSION}.tar.gz" \
            "dist/codex-usage-monitor-${RELEASE_VERSION}.tar.gz.sha256" \
            --verify-tag --title "Codex Usage Monitor $RELEASE_TAG" --generate-notes "${prerelease[@]}"
